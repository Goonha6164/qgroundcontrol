name: Windows (Qt5 + CMake)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: false
        default: "Release"
        type: choice
        options: [ "Release", "Debug" ]

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    env:
      BUILD_TYPE: ${{ inputs.build_type || 'Release' }}

    steps:
      - name: Checkout (submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Ninja
        run: |
          choco install ninja -y
          ninja --version

      # Qt5.15.2는 보통 MSVC2019(v142)랑 궁합이 제일 좋음
      - name: Setup MSVC 2019 (v142)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.2

      - name: Install Qt 5.15.2 (MSVC 2019)
        uses: jurplel/install-qt-action@v4
        id: qt
        with:
          version: "5.15.2"
          arch: "win64_msvc2019_64"
          cache: true
          # 레포 CMake가 요구하는 모듈에 맞춰 조절
          modules: "qtlocation qtpositioning"

      - name: Configure (CMake)
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${env:BUILD_TYPE} `
            -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qt_dir }}"

      - name: Build
        run: |
          cmake --build build --config ${env:BUILD_TYPE} --parallel

      - name: Install (staging)
        run: |
          cmake --install build --config ${env:BUILD_TYPE} --prefix "$pwd\staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QGC-Qt5-CMake-${{ env.BUILD_TYPE }}
          path: staging
