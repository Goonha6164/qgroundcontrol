name: Windows (Qt5.15.2 + MSVC2019 + CMake)

on:
  push:
    branches: [  ]
  pull_request:
    branches: [  ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AMD64 (Qt 5.15.2 / MSVC2019)
    runs-on: windows-2019

    defaults:
      run:
        shell: cmd

    env:
      QT_VERSION: "5.15.2"
      QT_ARCH: "win64_msvc2019_64"
      BUILD_TYPE: "Release"
      GST_VERSION: "1.16.3"
      GST_ROOT: "${{ github.workspace }}\\gstreamer\\1.0\\msvc_x86_64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Qt and GStreamer
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\Qt
            ${{ env.GST_ROOT }}
          key: ${{ runner.os }}-qt-${{ env.QT_VERSION }}-gst-${{ env.GST_VERSION }}

      # Ninja는 있는 경우도 많지만, 확실히 깔아두면 덜 빡침
      - name: Install Ninja
        run: choco install ninja -y

      - name: Install pkg-config (for GStreamer)
        run: choco install pkgconfiglite -y
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install aqtinstall (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==2.1.0"
          python -m aqt list-qt windows desktop --modules 5.15.2 win64_msvc2019_64
      
      - name: Install Qt 5.15.2 (with modules)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 --outputdir %GITHUB_WORKSPACE%\Qt --modules all

      - name: Install GStreamer (MSVC x64)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir "%GST_ROOT%" 2>nul
          set "GST_BASE_URL=https://gstreamer.freedesktop.org/data/pkg/windows/%GST_VERSION%"
          curl -L -o gst-runtime.msi %GST_BASE_URL%/gstreamer-1.0-msvc-x86_64-%GST_VERSION%.msi
          curl -L -o gst-devel.msi   %GST_BASE_URL%/gstreamer-1.0-devel-msvc-x86_64-%GST_VERSION%.msi
          msiexec /i gst-runtime.msi /qn /norestart /l*v gst-runtime.log INSTALLDIR=%GST_ROOT%
          msiexec /i gst-devel.msi /qn /norestart /l*v gst-devel.log INSTALLDIR=%GST_ROOT%
          echo %GST_ROOT%\bin>> %GITHUB_PATH%
          echo GSTREAMER_1_0_ROOT_MSVC_X86_64=%GST_ROOT%>> %GITHUB_ENV%
          echo PKG_CONFIG_PATH=%GST_ROOT%\lib\pkgconfig>> %GITHUB_ENV%



      # VS2019 + v142(14.29) 강제 고정
      - name: Set up MSVC devcmd (v142)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29

      - name: Configure (CMake)
        run: |
          set "Qt5_DIR=%GITHUB_WORKSPACE%\Qt\5.15.2\msvc2019_64\lib\cmake\Qt5"
          dir "%Qt5_DIR%"

          #echo Qt5_Dir=%Qt5_Dir%
          
          #cd /d %GITHUB_WORKSPACE%
          #dir windows 2>nul
          #dir windows\QGroundControl.rc 2>nul
          #dir /s /b *QGroundControl.rc*

          rmdir /s /q build 2>nul
          mkdir build

          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -DCMAKE_PREFIX_PATH="%Qt5_Dir%;%GST_ROOT%" ^
            -DQGC_GST_STREAMING=ON

      - name: Build
        run: |
          cmake --build build --config %BUILD_TYPE% --parallel 2

      # (선택) 빌드 산출물 확인용: exe가 어디 생기는지 찍어보기
      - name: Locate QGroundControl.exe
        run: |
          dir /s /b build\QGroundControl.exe || (echo "QGroundControl.exe not found under build\" & exit /b 1)

      - name: Upload build folder
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QGC-win64-build
          path: build

      - name: Upload GStreamer install logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gstreamer-install-logs
          path: |
            gst-runtime.log
            gst-devel.log
