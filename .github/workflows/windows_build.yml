name: Windows Build - Custom Version Release

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

defaults:
  run:
    shell: cmd

env:
  SOURCE_DIR:   ${{ github.workspace }}
  QT_VERSION:   5.15.2
  ARTIFACT:     QGroundControl-installer.exe
  BUILD_TYPE:   ${{ fromJSON('["DailyBuild", "StableBuild"]')[ github.ref_type == 'tag' || contains(github.ref, 'Stable_' ) ] }}

jobs:
  build:
    runs-on: windows-2019

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Get all tags for correct version determination
        run: git fetch --all --tags -f --depth 1

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version:      ${{ env.QT_VERSION }}
          host:         windows
          target:       desktop
          arch:         win64_msvc2019_64
          dir:          ${{ runner.temp }}
          modules:      qtcharts
          setup-python: false

      - name: Download JOM
        uses: suisei-cn/actions-download-file@v1.3.0
        with:
          url:    http://download.qt.io/official_releases/jom/jom.zip
          target: ${{ runner.temp }}\

      - name: Unzip JOM
        working-directory: ${{ runner.temp }}
        run: 7z x jom.zip -ojom

      - name: Download GStreamer
        uses: suisei-cn/actions-download-file@v1.3.0
        with:
          url:    https://s3-us-west-2.amazonaws.com/qgroundcontrol/dependencies/gstreamer-1.0-msvc-x86_64-1.18.1.msi
          target: ${{ runner.temp }}\

      - name: Download GStreamer dev
        uses: suisei-cn/actions-download-file@v1.3.0
        with:
          url:    https://s3-us-west-2.amazonaws.com/qgroundcontrol/dependencies/gstreamer-1.0-devel-msvc-x86_64-1.18.1.msi
          target: ${{ runner.temp }}\

      - name: Install GStreamer
        run: |
          cmd /c start /wait msiexec /package ${{ runner.temp }}\gstreamer-1.0-msvc-x86_64-1.18.1.msi /passive ADDLOCAL=ALL
          cmd /c start /wait msiexec /package ${{ runner.temp }}\gstreamer-1.0-devel-msvc-x86_64-1.18.1.msi /passive ADDLOCAL=ALL

      - name: Create build directory
        run: mkdir ${{ runner.temp }}\shadow_build_dir

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Build (capture + locate obj)
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: |
          @echo on
          qmake -r ${{ env.SOURCE_DIR }}\qgroundcontrol.pro "OBJECTS_DIR=." "MOC_DIR=generated" "RCC_DIR=generated" "UI_DIR=generated" CONFIG+=installer CONFIG+=${{ env.BUILD_TYPE }} || exit /b 1
          ${{ runner.temp }}\jom\jom QGroundControl_pch.obj -j1 >> build.log 2>&1
          ${{ runner.temp }}\jom\jom -j1 >> build.log 2>&1
          if errorlevel 1 (
            echo ===== FIND QGCMapEngine.obj anywhere under build dir ===== >> build.log
            dir /s /b QGCMapEngine.obj >> build.log 2>&1

            echo ===== LIST any QGCMap*.obj in build dir ===== >> build.log
            dir /s /b QGCMap*.obj >> build.log 2>&1

            echo ===== GREP Makefile for QGCMapEngine ===== >> build.log
            type Makefile | findstr /i QGCMapEngine >> build.log 2>&1

            echo ===== DUMP LINK RESPONSE FILES ===== >> build.log
            dir /b /s "%TEMP%\QGroundControl.exe.*.jom" >> build.log 2>&1
            for /f "delims=" %%F in ('dir /b /s "%TEMP%\QGroundControl.exe.*.jom" 2^>nul') do (
              echo ====== %%F ====== >> build.log
              type "%%F" >> build.log
            )

            exit /b 1
          )

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}\shadow_build_dir\build.log

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-installer
          path: ${{ runner.temp }}\shadow_build_dir\staging\QGroundControl-installer.exe
