name: Windows (Qt5.15.2 + MSVC2019 + CMake)

on:
  push:
    branches: [  ]
  pull_request:
    branches: [  ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AMD64 (Qt 5.15.2 / MSVC2019)
    runs-on: windows-2019

    defaults:
      run:
        shell: cmd

    env:
      QT_VERSION: "5.15.2"
      QT_ARCH: "win64_msvc2019_64"
      BUILD_TYPE: "Release"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Ninja는 있는 경우도 많지만, 확실히 깔아두면 덜 빡침
      - name: Install Ninja
        run: choco install ninja -y
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install aqtinstall (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==2.1.0"
          python -m aqt list-qt windows desktop --modules 5.15.2 win64_msvc2019_64
          python -m aqt install-qt -h

      #- name: Install Qt ${{ env.QT_VERSION }} (${{ env.QT_ARCH }})
      #  uses: jurplel/install-qt-action@v4
      #  with:
      #    version: ${{ env.QT_VERSION }}
      #    arch: ${{ env.QT_ARCH }}
      #    modules: qtlocation qtpositioning
      #   cache: true
      
      - name: Install Qt 5.15.2 (with modules)
        run: |
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 --outputdir %GITHUB_WORKSPACE%\Qt --modules all



      # VS2019 + v142(14.29) 강제 고정
      - name: Set up MSVC devcmd (v142)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29

      - name: Configure (CMake)
        run: |
          set "Qt5_DIR=%GITHUB_WORKSPACE%\Qt\5.15.2\msvc2019_64\lib\cmake\Qt5"
          dir "%Qt5_DIR%"

          echo Qt5_Dir=%Qt5_Dir%

          rmdir /s /q build 2>nul
          mkdir build

          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -DCMAKE_PREFIX_PATH="%Qt5_Dir%" ^
            -DQGC_ENABLE_GST_VIDEOSTREAMING=ON

      - name: Build
        run: |
          cmake --build build --config %BUILD_TYPE% --parallel 2

      # (선택) 빌드 산출물 확인용: exe가 어디 생기는지 찍어보기
      - name: Locate QGroundControl.exe
        run: |
          dir /s /b build\QGroundControl.exe || (echo "QGroundControl.exe not found under build\" & exit /b 1)

      - name: Upload build folder
        uses: actions/upload-artifact@v4
        with:
          name: QGC-win64-build
          path: build
