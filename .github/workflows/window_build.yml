name: Windows (Qt5.15.2 + MSVC2019 + CMake)

on:
  push:
    branches: [  ]
  pull_request:
    branches: [  ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AMD64 (Qt 5.15.2 / MSVC2019)
    runs-on: windows-2019

    defaults:
      run:
        shell: cmd

    env:
      QT_VERSION: "5.15.2"
      QT_ARCH: "win64_msvc2019_64"
      BUILD_TYPE: "Release"
      GST_VERSION: "1.16.3"
      GST_ROOT: "%GITHUB_WORKSPACE%\\gstreamer\\1.0\\msvc_x86_64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Qt and GStreamer
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\Qt
            ${{ env.GST_ROOT }}
          key: ${{ runner.os }}-qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-gst-${{ env.GST_VERSION }}

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install pkg-config (for GStreamer)
        run: choco install pkgconfiglite -y

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install aqtinstall (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==2.1.0"

      - name: Install Qt 5.15.2 (with modules)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 --outputdir %GITHUB_WORKSPACE%\Qt --modules all

      - name: Verify Qt deployment tools
        run: |
          dir /s /b %GITHUB_WORKSPACE%\Qt\*windeployqt.exe
          dir /s /b %GITHUB_WORKSPACE%\Qt\*qwindows.dll

      - name: Install GStreamer (MSVC x64)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          if not exist "%GST_ROOT%" mkdir "%GST_ROOT%" 2>nul
          dir %GST_ROOT%
          set "GST_BASE_URL=https://gstreamer.freedesktop.org/data/pkg/windows/%GST_VERSION%"
          curl -L -o gst-runtime.msi %GST_BASE_URL%/gstreamer-1.0-msvc-x86_64-%GST_VERSION%.msi
          curl -L -o gst-devel.msi %GST_BASE_URL%/gstreamer-1.0-devel-msvc-x86_64-%GST_VERSION%.msi
          msiexec /i gst-runtime.msi /qn /norestart /l*v gst-runtime.log INSTALLDIR=%GST_ROOT%
          msiexec /i gst-devel.msi /qn /norestart /l*v gst-devel.log INSTALLDIR=%GST_ROOT%
          echo %GST_ROOT%\bin>> %GITHUB_PATH%
          echo GSTREAMER_1_0_ROOT_MSVC_X86_64=%GST_ROOT%>> %GITHUB_ENV%
          echo PKG_CONFIG_PATH=%GST_ROOT%\lib\pkgconfig>> %GITHUB_ENV%
          set PKG_CONFIG_PATH=%GST_ROOT%\lib\pkgconfig
          set GSTREAMER_1_0_ROOT_MSVC_X86_64=%GST_ROOT%
          dir %GST_ROOT%\lib\pkgconfig\gstreamer-1.0.pc

      # VS2019 + v142(14.29) 강제 고정
      - name: Set up MSVC devcmd (v142)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29

      - name: Configure (CMake)
        run: |
          set "Qt5_DIR=%GITHUB_WORKSPACE%\Qt\5.15.2\msvc2019_64\lib\cmake\Qt5"
          dir "%Qt5_DIR%"
          rmdir /s /q build 2>nul
          mkdir build
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -DCMAKE_PREFIX_PATH="%Qt5_Dir%;%GST_ROOT%" ^
            -DQGC_GST_STREAMING=ON

      - name: Build
        run: |
          cmake --build build --config %BUILD_TYPE% --parallel 2

      - name: Run windeployqt
        run: |
          for /f "delims=" %%f in ('dir /s /b %GITHUB_WORKSPACE%\Qt\*windeployqt.exe') do set "WINDEPLOYQT=%%f"
          if not defined WINDEPLOYQT (echo "windeployqt.exe not found" & exit /b 1)
          for /f "delims=" %%f in ('dir /s /b build\QGroundControl.exe') do set "QGC_EXE=%%f"
          if not defined QGC_EXE (echo "QGroundControl.exe not found" & exit /b 1)
          "%WINDEPLOYQT%" "%QGC_EXE%"

      - name: Check for shapelib artifacts
        run: |
          dir /s /b build\shp.*

      - name: Copy shp.dll next to exe
        run: |
          setlocal enabledelayedexpansion
          set "SHP="
          for /f "delims=" %%f in ('dir /s /b build\shp.dll') do set "SHP=%%f"
          if not defined SHP (echo "shp.dll not found" & exit /b 1)
          set "EXE="
          for /f "delims=" %%f in ('dir /s /b build\QGroundControl.exe') do set "EXE=%%f"
          if not defined EXE (echo "QGroundControl.exe not found" & exit /b 1)
          for %%d in ("!EXE!") do set "EXE_DIR=%%~dpd"
          copy /y "!SHP!" "!EXE_DIR!"

      - name: Locate QGroundControl.exe
        run: |
          dir /s /b build\QGroundControl.exe || (echo "QGroundControl.exe not found under build\" & exit /b 1)

      - name: Upload build folder
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QGC-win64-build
          path: build

      - name: Upload GStreamer install logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gstreamer-install-logs
          path: |
            gst-runtime.log
            gst-devel.log

